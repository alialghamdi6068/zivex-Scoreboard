# إعدادات ZivexScoreboard
# كل النصوص التي تظهر للاعبين بالإنجليزية. التعليقات فقط للشرح.

settings:
  enabled: true

  # اسم السيرفر ولون العنوان.
  server-name: "&5&lZivexMC"
  title: "&5&lZivexMC"

  # عدد مرات تحديث السكوربورد بالـticks. 20 = ثانية واحدة.
  update-ticks: 20

  # العوالم الموجودة هنا لن يظهر فيها السكوربورد.
  disabled-worlds:
    - "example_disabled_world"

  # الفوتر يظهر في أسفل السكوربورد.
  footer: "&7play.zivexmc.net"

  # خطوط السكوربورد بالترتيب.
  lines:
    - "&8&m----------------"
    - "&fPlayer &7» &d%player%"
    - "&fRank &7» &d%rank%"
    - ""
    - "&fShards &7» &d%shards%"
    - "&fMoney &7» &d%money%"
    - ""
    - "&fOnline &7» &d%online%"
    - "&fPing &7» &d%ping%ms"
    - ""
    - "&5zivexmc"
    - "&8&m----------------"

placeholders:
  # إذا لم تستخدم إضافة اقتصادية، يبقى %money% = 0.
  money-default: "0"
  shards-default: "0"
  rank-default: "Player"

messages:
  reloaded: "&aZivexScoreboard reloaded."
  enabled: "&aZivexScoreboard enabled."
  disabled: "&cZivexScoreboard disabled."
  usage: "&cUsage: /zivexscoreboard <reload|toggle>"
  no-permission: "&cYou don't have permission."

# ترتيب الرتب من الأعلى إلى الأقل.
ranks:
  owner:
    permission: "zivex.rank.owner"
    display: "&5Owner"
  manager:
    permission: "zivex.rank.manager"
    display: "&6Manager"
  developer:
    permission: "zivex.rank.developer"
    display: "&bDeveloper"
  admin:
    permission: "zivex.rank.admin"
    display: "&cAdmin"
  moderator:
    permission: "zivex.rank.moderator"
    display: "&9Moderator"
  helper:
    permission: "zivex.rank.helper"
    display: "&aHelper"
  mvp:
    permission: "zivex.rank.mvp"
    display: "&dMVP"
  vip:
    permission: "zivex.rank.vip"
    display: "&eVIP"
