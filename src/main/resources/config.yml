# إعدادات ZivexScoreboard
# النصوص التي تظهر للاعبين بالإنجليزية، والتعليقات فقط للشرح.

settings:
  enabled: true
  server-name: "&5&lZivexMC"
  title: "&5&lZivexMC"
  update-ticks: 20

  # اكتب أسماء العوالم التي لا تريد ظهور السكوربورد فيها.
  disabled-worlds: []

  footer: "&7play.zivexmc.net"

  # الحد الأقصى لأسطر الـsidebar هو 15.
  lines:
    - "&8&m----------------"
    - "&fPlayer &7» &d%player%"
    - "&fRank &7» &d%rank%"
    - ""
    - "&fShards &7» &d%shards%"
    - "&fMoney &7» &d%money%"
    - ""
    - "&fOnline &7» &d%online%"
    - "&fPing &7» &d%ping%ms"
    - ""
    - "&5zivexmc"
    - "&8&m----------------"

placeholders:
  # قيم احتياطية عند عدم توفر البيانات.
  money-default: "0"
  shards-default: "0"
  rank-default: ""

  # ملف قاعدة البيانات المشتركة بين أنظمة Zivex.
  database-file: "../Zivex/database.db"

messages:
  reloaded: "&aZivexScoreboard reloaded."
  enabled: "&aZivexScoreboard enabled."
  disabled: "&cZivexScoreboard disabled."
  usage: "&cUsage: /zivexscoreboard <reload|toggle>"
  no-permission: "&cYou don't have permission."
